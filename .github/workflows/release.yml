name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@murchalka'
      - id: version
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Reject an existing immutable release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists and remains immutable." >&2
            exit 1
          fi
      - run: dotnet restore Murchalka.ClientRuntime.slnx --configfile NuGet.Config
      - run: dotnet format Murchalka.ClientRuntime.slnx --verify-no-changes --no-restore
      - run: dotnet build Murchalka.ClientRuntime.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}
      - run: dotnet run --project tests/Murchalka.ClientRuntime.Tests/Murchalka.ClientRuntime.Tests.csproj -c Release --no-build --no-restore -- -reporter quiet
      - run: dotnet pack src/Murchalka.ClientRuntime/Murchalka.ClientRuntime.csproj -c Release --no-build --no-restore -p:Version=${{ steps.version.outputs.value }} -o artifacts/release
      - run: test "$(node --print 'require("./package.json").version')" = "${{ steps.version.outputs.value }}"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ts
      - run: npm pack --pack-destination artifacts/release
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'artifacts/release/*.nupkg' }
      - name: Publish package
        run: dotnet nuget push "artifacts/release/*.nupkg" --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/Murchalka-AI/index.json" --skip-duplicate
      - name: Publish TypeScript package
        env: { NODE_AUTH_TOKEN: "${{ github.token }}" }
        run: npm publish --provenance
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" artifacts/release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
