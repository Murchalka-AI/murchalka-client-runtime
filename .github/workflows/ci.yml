name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - run: dotnet restore Murchalka.ClientRuntime.slnx --configfile NuGet.Config
      - if: runner.os == 'Linux'
        run: dotnet format Murchalka.ClientRuntime.slnx --verify-no-changes --no-restore
      - run: dotnet build Murchalka.ClientRuntime.slnx -c Release --no-restore
      - run: dotnet run --project tests/Murchalka.ClientRuntime.Tests/Murchalka.ClientRuntime.Tests.csproj -c Release --no-build --no-restore -- -reporter quiet

